<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iRent 智能車況管家｜Demo 分割畫面</title>
<style>
body{margin:0;background:#F4F5F7;font-family:"Microsoft JhengHei",system-ui,sans-serif}
.bar{background:#1B1F2A;color:#fff;padding:8px 16px;display:flex;gap:16px;align-items:center;font-size:14px}
.bar b{background:#D62839;border-radius:6px;padding:2px 8px;font-style:italic}
.bar span{color:#C9CED8;font-size:12px}
.bar .sp{flex:1}
.bar select,.bar button{font-family:inherit;font-size:13px;border-radius:8px;border:1px solid #4A5163;background:#2B3140;color:#fff;padding:5px 10px}
.bar label{font-size:13px;color:#C9CED8}
.wrap{display:grid;grid-template-columns:440px 1fr;gap:12px;padding:12px;height:calc(100vh - 48px)}
iframe{width:100%;height:100%;border:0;border-radius:14px;background:#fff}
.lab{font-size:12px;color:#5B6270;margin:0 0 4px 4px}
.col{display:flex;flex-direction:column;min-height:0}.col iframe{flex:1}
@media(max-width:1000px){.wrap{grid-template-columns:1fr;height:auto}.col iframe{height:820px}}
</style></head><body>
<div class="bar"><b>iRent</b> 智能車況管家 Demo <span>左：租客端　右：客服後台（即時同步）</span><div class="sp"></div>
<label>Demo 情境 <select id="scn" onchange="setScn(this.value)">
<option value="ok">一般情境：無異常</option><option value="dent">還車：右側新增凹陷</option><option value="dirty">還車：後座髒汙</option><option value="inherit">取車：承接髒車</option></select></label>
<label><input type="checkbox" id="ai" onchange="setAI(this.checked)"> AI 模式 (Gemini)</label>
<button onclick="doReset()">重置</button></div>
<div class="wrap">
  <div class="col"><div class="lab">租客端</div><iframe id="u" src="/?embed=1" title="租客端"></iframe></div>
  <div class="col"><div class="lab">客服／營運後台</div><iframe id="a" src="/admin?embed=1" title="客服後台"></iframe></div>
</div>
<script>
const U = () => document.getElementById('u').contentWindow;
function setScn(v) { U().S.scenario = v; }
function setAI(on) { const w = U(); w.toggleAI(on); document.getElementById('ai').checked = w.S.ai; }
function doReset() { U().resetAll(); }
</script>
</body></html>
