<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iRent 智能車況管家｜租客端</title>
<style>
:root{--red:#D62839;--ink:#1B1F2A;--gray:#5B6270;--line:#E1E4EA;--bg:#F4F5F7;--green:#2E9E6B;--amber:#E8962E;--white:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
header h1{font-size:18px;margin:0;display:flex;align-items:center;gap:10px}
header h1 b{background:var(--red);border-radius:6px;padding:2px 8px;font-style:italic}
header .sp{flex:1}
header label{font-size:13px;color:#C9CED8;display:flex;align-items:center;gap:6px}
select,button{font-family:inherit}
select{padding:6px 8px;border-radius:8px;border:1px solid #4A5163;background:#2B3140;color:#fff;font-size:13px}
.hbtn{background:#2B3140;color:#fff;border:1px solid #4A5163;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.sw{display:flex;align-items:center;gap:6px;font-size:13px;color:#C9CED8}
main{display:grid;grid-template-columns:430px 1fr;gap:24px;padding:24px;max-width:1400px;margin:0 auto;align-items:start}
@media(max-width:980px){main{grid-template-columns:1fr;padding:12px}}
.phone{width:390px;max-width:100%;height:780px;margin:0 auto;background:var(--ink);border-radius:44px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#screen{background:#fff;border-radius:34px;height:100%;overflow-y:auto;position:relative}
.ph-top{background:var(--red);color:#fff;padding:22px 18px 14px;border-radius:34px 34px 0 0}
.ph-top h2{margin:0;font-size:18px}
.ph-top p{margin:4px 0 0;font-size:12px;opacity:.9}
.pad{padding:16px}
.vcard{background:var(--bg);border-radius:14px;padding:14px;margin-bottom:12px}
.vcard .plate{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:1px 8px;font-weight:700;letter-spacing:1px}
.big{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:10px;text-align:left}
.big small{display:block;font-weight:400;font-size:12px;opacity:.85;margin-top:3px}
.b-red{background:var(--red);color:#fff}.b-ink{background:var(--ink);color:#fff}.b-gray{background:#e9ebf0;color:var(--ink)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer}
.btn.red{background:var(--red);color:#fff}.btn.ink{background:var(--ink);color:#fff}.btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.prog{display:flex;gap:4px;margin:10px 0}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--red)}.prog i.done{background:var(--green)}
.cam{position:relative;width:100%;aspect-ratio:4/3;background:#3A4150;border-radius:14px;overflow:hidden}
.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam svg{position:absolute;inset:0;width:100%;height:100%}
.cam .hint{position:absolute;left:0;right:0;top:8px;text-align:center;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;font-weight:700}
.banner.bad{background:#FDECEE;color:#A81626}.banner.ok{background:#E5F5EE;color:#1E7A50}.banner.warn{background:#FFF3E0;color:#9A5A0B}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;border-radius:999px;padding:3px 10px;font-weight:700}
.chip.ok{background:#E5F5EE;color:#1E7A50}.chip.bad{background:#FDECEE;color:#A81626}.chip.wait{background:#EEF0F4;color:var(--gray)}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;color:#fff}
.tag.high{background:var(--red)}.tag.mid{background:var(--amber)}.tag.low{background:var(--green)}.tag.gray{background:#8a92a1}
.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.thumbs div{aspect-ratio:1;background:var(--bg);border-radius:6px;overflow:hidden;position:relative;font-size:9px}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs div.cur{outline:2px solid var(--red)}
.step{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--line)}
.spin{width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.imgbox{position:relative;display:inline-block;width:100%}
.imgbox img{width:100%;display:block;border-radius:10px}
.imgbox .bx{position:absolute;border:3px solid var(--red);border-radius:6px;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.res{border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.res h4{margin:0 0 6px;font-size:14px}
.res p{margin:4px 0;font-size:13px;color:var(--gray)}
/* dashboard */
.dash{background:#fff;border-radius:18px;box-shadow:0 2px 14px rgba(0,0,0,.08);overflow:hidden}
.dash-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.dash-h h2{margin:0;font-size:18px}
.dash-h .live{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(46,158,107,.2)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 20px}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--bg);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px}.kpi span{font-size:12px;color:var(--gray)}
.dgrid{display:grid;grid-template-columns:340px 1fr;gap:0;border-top:1px solid var(--line);min-height:520px}
@media(max-width:1250px){.dgrid{grid-template-columns:1fr}}
.alist{border-right:1px solid var(--line);max-height:620px;overflow-y:auto}
.ai{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.ai:hover{background:#fafbfc}.ai.sel{background:#FFF1F2}
.ai.flash{animation:fl 1.6s}
@keyframes fl{0%{background:#FFD9DD}100%{background:transparent}}
.ai .t{font-weight:700;font-size:14px;margin:4px 0 2px}.ai .s{font-size:12px;color:var(--gray)}
.detail{padding:18px 20px}
.detail h3{margin:0 0 6px;font-size:18px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.cmp figure{margin:0}.cmp figcaption{font-size:12px;color:var(--gray);margin-bottom:4px;font-weight:700}
.empty{color:var(--gray);padding:60px 20px;text-align:center}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.flow span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--gray);font-weight:700}
.flow span.on{background:var(--ink);color:#fff}
#toast{position:fixed;right:20px;top:20px;z-index:9;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;border-left:5px solid var(--red);border-radius:10px;padding:12px 16px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:ti .3s}
@keyframes ti{from{transform:translateX(40px);opacity:0}}
.note{font-size:12px;color:var(--gray);padding:0 20px 16px}
body.only-phone header,body.only-phone .dash,body.only-phone #toast{display:none}
body.only-dash header,body.only-dash section:first-child,body.only-dash #toast,body.only-dash .note{display:none}
body.only-phone main,body.only-dash main{display:block;padding:0;max-width:none}
body.only-phone{background:#fff}body.only-phone .phone{margin:0;box-shadow:none}
body.only-dash main{padding:0}body.only-dash .dgrid{grid-template-columns:340px 1fr}body.only-dash .dash{border-radius:0;box-shadow:none}

header a.hl{color:#fff;font-size:13px;text-decoration:none;border:1px solid #4A5163;border-radius:8px;padding:6px 12px;background:#2B3140}
main.usr{display:block;padding:20px}
main.adm{display:block;max-width:1400px;margin:0 auto;padding:20px}
@media(max-width:520px){
  main.usr{padding:0}
  header{padding:8px 12px}header h1{font-size:15px}
  .phone{width:100%;height:calc(100vh - 100px);padding:0;border-radius:0;background:none;box-shadow:none}
  #screen{border-radius:0}.ph-top{border-radius:0}
}
body.embed header{display:none}
body.embed main.usr{padding:8px}
body.embed main.adm{padding:8px}
body.embed .phone{height:calc(100vh - 16px)}

.stepper{display:flex;justify-content:space-between;margin:2px 0 14px}.st{flex:1;text-align:center;font-size:10.5px;color:var(--gray)}
.st i{display:flex;margin:0 auto 4px;width:24px;height:24px;border-radius:50%;background:var(--line);align-items:center;justify-content:center;font-style:normal;font-weight:700;color:#fff;font-size:12px}
.st.on i{background:var(--red)}.st.done i{background:var(--green)}.st.on{color:var(--ink);font-weight:700}
.opt{border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}.opt.sel{border-color:var(--red);background:#FFF1F2}.opt b{display:block;font-size:15px}.opt span{font-size:12px;color:var(--gray)}
.phone input[type=text],.phone textarea,.phone select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;color:var(--ink);background:#fff}
.row2{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.chk{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
</style>
</head>
<body>
<header>
  <h1><b>iRent</b> 智能車況管家 <span style="font-weight:400;font-size:13px;opacity:.7">租客端</span></h1>
  <div class="sp"></div>
  <label>Demo 情境
    <select id="scn" onchange="S.scenario=this.value">
      <option value="ok">一般情境：無異常</option>
      <option value="dent">還車：右側新增凹陷</option>
      <option value="dirty">還車：後座髒汙</option>
      <option value="inherit">取車：承接髒車</option>
    </select>
  </label>
  <label class="sw"><input type="checkbox" id="aiSw" onchange="toggleAI(this.checked)"> <span id="aiLbl">AI 模式 (Gemini)</span></label>
  <button class="hbtn" onclick="resetAll()">重置</button>
  <a class="hl" href="/admin" target="_blank">開啟客服後台 ↗</a>
</header>
<main class="usr"><div class="phone"><div id="screen"></div></div></main>
<div id="toast"></div>
<input type="file" id="file" accept="image/*" capture="environment" hidden onchange="onFile(event)">
<script src="/common.js"></script>
<script>
if (new URLSearchParams(location.search).get('embed')) document.body.classList.add('embed');
const S = { phase: 'home', mode: null, idx: 0, photos: {}, cur: null, scenario: 'ok', ai: false, aiAvailable: false, pickup: null, rental: null, lastAlerts: [], camOn: false, stream: null, back: 'home', result: null, progress: [], t0: 0 };
async function api(task, context, images) {
  const imgs = await Promise.all(images.map((u) => shrink(u)));
  const r = await fetch('/api/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ task, context, images: imgs }) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || 'AI error'); return j;
}
async function checkQuality(p, v) {
  const m = await metrics(p.url);
  const checks = [
    { k: '光線', ok: m.mean >= 60 && m.mean <= 225, msg: m.mean < 60 ? '光線太暗，請移到明亮處或開啟車燈後重拍' : '畫面過曝或逆光，請調整角度後重拍' },
    { k: '清晰度', ok: m.mean < 60 || m.lap >= 25, msg: '照片模糊，請穩住手機、點擊對焦後重拍' },
    { k: '角度', ok: !(p.meta && p.meta.wrong), msg: `拍攝角度不對，請對準「${v.name}」重拍` },
  ];
  if (v.plate) checks.push({ k: '車牌', ok: !(p.meta && p.meta.wrong), msg: '沒有拍到車牌，請讓車牌清楚入鏡' });
  let aiNote = null;
  if (S.ai && !(p.meta && p.meta.sample) && checks.every((c) => c.ok)) {
    try {
      const a = await api('quality', { viewName: v.name }, [p.url]); aiNote = 'AI 已檢查';
      if (!a.view_match) { checks.find((c) => c.k === '角度').ok = false; checks.find((c) => c.k === '角度').msg = a.tip || `拍攝角度不對，請對準「${v.name}」重拍`; }
      if (v.plate && !a.plate_visible) { const c = checks.find((c) => c.k === '車牌'); c.ok = false; c.msg = a.tip || '沒有拍到車牌，請讓車牌清楚入鏡'; }
      if (a.distance && a.distance !== 'ok') checks.push({ k: '距離', ok: false, msg: a.distance === 'too_far' ? '離車太遠，請靠近一點' : '離車太近，請退後一點' });
      if (a.lens_or_body_dirty) checks.push({ k: '髒污', ok: false, msg: '鏡頭或車身髒污影響判讀，請擦拭後重拍' });
    } catch (e) { aiNote = 'AI 暫時無法使用，僅做本機檢查'; }
  }
  return { checks, ok: checks.every((c) => c.ok), m, aiNote };
}

// ============ 分析（模擬 / Gemini）============
function mockExisting(view) { return view.id === 'left' ? { existing_damage: [{ location: '車身左側・後門', type: 'scratch', severity: '輕', confidence: .88, description: '後門有一道約 10 cm 細刮痕', box: BOX_SCRATCH }] } : { existing_damage: [] }; }
function mockCompare(view) { return (view.id === 'right' && S.scenario === 'dent') ? { new_damage: [{ location: '車身右側・前門', type: 'dent', severity: '中', confidence: .92, description: '前門新增約 8 cm 凹陷，漆面輕微受損', box: BOX_DENT }] } : { new_damage: [] }; }
function mockInterior(view, phase) {
  const dirty = view.id === 'seat-rear' && ((phase === 'return' && S.scenario === 'dirty') || (phase === 'pickup' && S.scenario === 'inherit'));
  if (dirty) return { level: 'dirty', reason: '後座有明顯飲料污漬與垃圾，須立即清潔', confidence: .94, box: BOX_DIRTY };
  if (view.id === 'seat-rear') return { level: 'normal', reason: '少量灰塵，不影響使用', confidence: .86, box: null };
  return { level: 'clean', reason: '座椅與地墊整潔', confidence: .9, box: null };
}
async function analyzeView(view, phase, photo, baseline) {
  if (!S.ai) { await sleep(450); return view.interior ? mockInterior(view, phase) : (phase === 'pickup' ? mockExisting(view) : mockCompare(view)); }
  if (view.interior) return api('interior', { viewName: view.name }, [photo]);
  return phase === 'pickup' ? api('existing', { viewName: view.name }, [photo]) : api('compare', { viewName: view.name }, [baseline, photo]);
}

async function analyze() {
  S.phase = 'analyzing'; S.t0 = Date.now();
  S.progress = VIEWS.map((v) => ({ v, st: 'wait' })); render();
  const out = [];
  await Promise.all(VIEWS.map(async (v, i) => {
    S.progress[i].st = 'run'; render();
    let r;
    try {
      const baseline = S.mode === 'return' ? ((S.pickup && S.pickup.photos[v.id]) || drawSample(v.id, 'pickup', S.scenario, 'ok')) : null;
      r = await analyzeView(v, S.mode, S.photos[v.id].url, baseline);
      out[i] = { v, r, baseline };
    } catch (e) { out[i] = { v, r: v.interior ? { level: 'clean', reason: 'AI 暫時無法使用', confidence: 0 } : { new_damage: [], existing_damage: [] }, baseline: null, err: String(e.message || e) }; }
    S.progress[i].st = 'done'; render();
  }));
  finish(out);
}

function finish(out) {
  const sec = ((Date.now() - S.t0) / 1000).toFixed(1);
  const res = { sec, items: out, damages: [], dirty: [], levels: [], aiErr: out.some((o) => o.err) };
  out.forEach((o) => {
    if (o.v.interior) { res.levels.push({ v: o.v, ...o.r }); if (o.r.level === 'dirty') res.dirty.push({ v: o.v, ...o.r }); }
    else (S.mode === 'pickup' ? (o.r.existing_damage || []) : (o.r.new_damage || [])).forEach((d) => res.damages.push({ v: o.v, ...d, baseline: o.baseline }));
  });
  S.result = res; S.lastAlerts = [];
  if (S.mode === 'return') {
    const bad = res.damages.length || res.dirty.length;
    postStats({ returns: 1, auto: bad ? 0 : 1, latency: bad ? sec + ' 秒' : undefined });
    res.damages.forEach((d) => postAlert({ type: 'damage', severity: d.severity === '重' || d.confidence > .9 ? 'high' : 'mid', title: `新車損：${d.location}${TYPE_ZH[d.type] || ''}`, detail: d.description, v: d.v, before: d.baseline, after: S.photos[d.v.id].url, box: d.box, conf: d.confidence, sev: d.severity, sec }));
    res.dirty.forEach((d) => postAlert({ type: 'dirty', severity: 'high', title: `車內髒汙：${d.v.name}`, detail: d.reason, v: d.v, before: null, after: S.photos[d.v.id].url, box: d.box, conf: d.confidence, sev: '須立即清潔', sec }));
  } else {
    res.dirty.forEach((d) => postAlert({ type: 'inherit', severity: 'high', title: `取車即發現髒汙：${d.v.name}`, detail: d.reason + '（租客取車前回報，非本次租借造成）', v: d.v, before: null, after: S.photos[d.v.id].url, box: d.box, conf: d.confidence, sev: '承接前車', sec }));
  }
  S.phase = 'result'; render();
}

// ============ 與後台同步 ============
async function postJSON(url, body, method) {
  const r = await fetch(url, { method: method || 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  return r.json();
}
async function postAlert(a) {
  try {
    const before = a.before ? await shrink(a.before, 800) : null, after = a.after ? await shrink(a.after, 800) : null;
    const j = await postJSON('/api/alerts', { alert: { type: a.type, severity: a.severity, title: a.title, detail: a.detail, viewName: a.v.name, conf: a.conf, sev: a.sev, sec: a.sec, box: a.box, plate: PLATE, car: CAR, renter: '租客 王＊明' }, before, after });
    if (j && j.id) S.lastAlerts.push(j.id);
    toast('🔔 已通知客服：' + a.title);
  } catch (e) { toast('通知客服失敗，請稍後再試'); }
}
function postStats(s) { postJSON('/api/stats', s).catch(() => {}); }

// ============ 手機畫面 ============
function topBar(title, sub) { return `<div class="ph-top"><h2>${title}</h2><p>${sub}</p></div>`; }
function progBar() { return `<div class="prog">${VIEWS.map((v, i) => `<i class="${S.photos[v.id] ? 'done' : i === S.idx ? 'on' : ''}"></i>`).join('')}</div>`; }
const PICK_STEPS = ['訂單確認', '檢視車況', '確認取車', '開啟車門'];
const RET_STEPS = ['還車區域', '拍照上傳', '停車位置', '付款還車', '鎖車完成'];
function stepper(steps, cur) { return `<div class="stepper">${steps.map((s, i) => `<div class="st ${i < cur ? 'done' : i === cur ? 'on' : ''}"><i>${i < cur ? '✓' : i + 1}</i><span>${s}</span></div>`).join('')}</div>`; }
function fmtDur(ms) { const s = Math.floor(ms / 1000), m = Math.floor(s / 60); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function render() {
  const el = document.getElementById('screen');
  const m = { home: homeHtml, driving: drivingHtml, returnArea: returnAreaHtml, capture: captureHtml, analyzing: analyzingHtml, result: resultHtml, parking: parkingHtml, pay: payHtml, done: doneHtml, report: reportHtml, appeal: appealHtml };
  el.innerHTML = (m[S.phase] || resultHtml)();
  clearInterval(S.tmr);
  if (S.camOn && S.phase === 'capture') { const v = document.getElementById('vid'); if (v && S.stream) v.srcObject = S.stream; }
  if (S.phase === 'driving') S.tmr = setInterval(() => { const e = document.getElementById('tm'); if (e && S.rental) e.textContent = fmtDur(Date.now() - S.rental.startedAt); }, 1000);
}
function homeHtml() {
  return topBar('我的訂單', '預約成功，請於保留時間內取車') + `<div class="pad">
    <div class="vcard"><div style="display:flex;justify-content:space-between;align-items:center"><b>${CAR}</b><span class="tag mid">保留 15 分鐘</span></div>
    <div style="margin:8px 0"><span class="plate">${PLATE}</span></div>
    <div style="font-size:13px;color:var(--gray)">📍 停放位置：台北市信義區市府路 路邊停車格（示範）</div>
    <div class="row" style="margin-top:10px"><button class="btn line sm" onclick="toast('🧭 已開啟導航（示範）')">🧭 導航</button><button class="btn line sm" onclick="toast('📣 車輛發出喇叭聲並閃燈（示範）')">📣 叭叭</button></div></div>
    ${stepper(PICK_STEPS, 1)}
    <button class="big b-red" onclick="startFlow('pickup')">📷 檢視車況<small>取車前請檢查外觀與車內，AI 會即時檢查照片、登記既有車損</small></button>
    <div class="row"><button class="btn line sm" onclick="startFlow('pickup',true)">⚡ 取車自動拍完（Demo）</button></div>
    <p style="font-size:12px;color:var(--gray);margin-top:14px">流程參考 iRent App：訂單確認 → 檢視車況（拍照）→ 確認取車（開始計租）→ 開啟車門。右上角可切換 Demo 情境。</p></div>`;
}
function drivingHtml() {
  const n = S.pickup ? S.pickup.existing.length : 0;
  return topBar('租用中', `${CAR} ・ ${PLATE}`) + `<div class="pad">
    <div class="vcard" style="text-align:center"><div style="font-size:12px;color:var(--gray)">已租用</div><div id="tm" style="font-size:34px;font-weight:700;letter-spacing:1px">${fmtDur(Date.now() - S.rental.startedAt)}</div>
    <div style="font-size:12px;color:var(--gray)">取車時 AI 已登記 ${n} 處既有車損，還車只會比對新增</div></div>
    <div class="row" style="margin-bottom:12px"><button class="btn line" style="flex:1" onclick="toast('🔓 已解鎖（示範）')">🔓 開啟車門</button><button class="btn line" style="flex:1" onclick="toast('🔒 已上鎖（示範）')">🔒 鎖車</button></div>
    <button class="big b-gray" onclick="openReport('driving')">🚨 車況回報<small>行駛中發現車輛問題，可立即回報客服</small></button>
    <button class="big b-ink" onclick="S.phase='returnArea';render()">🏁 還車<small>選擇還車區域 → 拍照上傳 → 付款還車</small></button>
    <div class="row"><button class="btn line sm" onclick="S.rental.area='同站租還';startFlow('return',true)">⚡ 還車自動拍完（Demo）</button></div></div>`;
}
function returnAreaHtml() {
  const a = S.rental.area || '同站租還';
  const opt = (k, d) => `<div class="opt ${a === k ? 'sel' : ''}" onclick="S.rental.area='${k}';render()"><b>${k}</b><span>${d}</span></div>`;

    ${opt('同站租還', '回原站點還車')}${opt('路邊租還', '公有停車格及調度停車場（營運區域內）')}
    <button class="btn red" style="width:100%;margin-top:6px" onclick="startFlow('return')">下一步：拍攝車輛四周與車內</button>
    <div class="row" style="margin-top:10px"><button class="btn line sm" onclick="S.phase='driving';render()">返回</button></div></div>`;
}
function goParking() { S.phase = 'parking'; render(); }
function parkingHtml() {
  return topBar('停車位置', '填寫停車格編號或易辨識地標') + `<div class="pad">${stepper(RET_STEPS, 2)}
    <input type="text" id="pk" placeholder="例：B3、100 號／XX路XX號" value="${S.rental.parking || ''}">
    <p style="font-size:12px;color:var(--gray)">範例：停車場請填樓層＋車格號碼；路邊請填門牌號碼或明顯地標。</p>
    <div style="margin:12px 0 6px;font-size:14px;font-weight:700">時數折抵</div>
    <select id="cr"><option value="0">不折抵</option><option value="30" ${S.rental.credit === 30 ? 'selected' : ''}>使用 30 分鐘折抵券</option></select>
    <button class="btn red" style="width:100%;margin-top:16px" onclick="goPay()">下一步：付款</button></div>`;
}
function goPay() { S.rental.parking = document.getElementById('pk').value.trim() || '（未填寫）'; S.rental.credit = Number(document.getElementById('cr').value); S.phase = 'pay'; render(); }
function payHtml() {
  const rent = 245, km = 38, etag = 0, off = S.rental.credit ? 30 : 0, total = rent + km + etag - off;
  const row = (k, v) => `<div class="row2"><span>${k}</span><b>${v}</b></div>`;
  return topBar('付款還車', '費用為示範金額') + `<div class="pad">${stepper(RET_STEPS, 3)}
    ${row('租借時間', '1 小時 42 分（示範）')}${row('租金', 'NT$ ' + rent)}${row('里程費', 'NT$ ' + km)}${row('Etag 過路費', 'NT$ ' + etag)}${off ? row('時數折抵', '- NT$ ' + off) : ''}${row('停車位置', S.rental.parking)}
    <div class="row2" style="font-size:16px"><span>應付總額</span><b style="color:var(--red)">NT$ ${total}</b></div>

function doneHtml() {
  return topBar('完成還車', `${CAR} ・ ${PLATE}`) + `<div class="pad">${stepper(RET_STEPS, 5)}
    <div class="banner ok">車輛已上鎖，感謝您的使用</div>
    <div class="res"><h4>還車資訊</h4><p>停車位置：${S.rental.parking}</p><p>${S.result && (S.result.damages.length || S.result.dirty.length) ? 'AI 已偵測到異常並通知客服，將由客服確認。' : 'AI 檢查未發現異常。'}</p></div>
    <p style="font-size:13px;color:var(--gray)">還車後 15 分鐘內若發現車輛問題，可點「點我回報」。</p>
    <button class="btn line" style="width:100%;margin-bottom:10px" onclick="openReport('done')">點我回報</button>
    <button class="btn ink" style="width:100%" onclick="finishReturn()">回到首頁</button></div>`;
}
function appealHtml() {
  return topBar('補充說明／申訴', '若認為判讀有誤，可在此說明，客服會參考並人工確認') + `<div class="pad">
    <div class="banner warn">AI 只提出預警，不會直接作為責任判定。</div>
    <textarea id="ap" rows="5" placeholder="例：這道凹陷取車前就存在，但取車時我沒有注意到。"></textarea>
    <div class="row" style="margin-top:14px"><button class="btn red" style="flex:1" onclick="submitAppeal()">送出給客服</button><button class="btn line" onclick="S.phase='result';render()">返回</button></div></div>`;
}
async function submitAppeal() {
  const note = document.getElementById('ap').value.trim();
  if (!note) { toast('請先填寫說明'); return; }
  if (!S.lastAlerts.length) { toast('尚未建立案件，請稍後再試'); return; }
  await Promise.all(S.lastAlerts.map((id) => postJSON('/api/alerts/' + id, { note }, 'PATCH')));
  toast('✅ 已送出，客服會參考您的說明'); S.phase = 'result'; render();
}
const REPORT_OPTS = ['外觀有損傷', '車內髒亂或異味', '設備異常（喇叭、冷氣、燈光）', '其他問題'];
function openReport(back) { S.back = back; S.phase = 'report'; render(); }
function reportHtml() {
  return topBar('車況回報', '勾選發現的異況，客服會盡快處理') + `<div class="pad">
    ${REPORT_OPTS.map((o, i) => `<label class="chk"><input type="checkbox" class="rp" value="${o}"> ${o}</label>`).join('')}
    <textarea id="rn" rows="3" style="margin-top:12px" placeholder="補充說明（選填）"></textarea>
    <div class="row" style="margin-top:14px"><button class="btn red" style="flex:1" onclick="submitReport()">送出回報</button><button class="btn line" onclick="S.phase=S.back;render()">取消</button></div></div>`;
}
function submitReport() {
  const picked = [...document.querySelectorAll('.rp:checked')].map((e) => e.value);
  if (!picked.length) { toast('請至少勾選一項'); return; }
  const note = document.getElementById('rn').value.trim();
  postAlert({ type: 'report', severity: 'mid', title: '租客回報：' + picked.join('、'), detail: note || '租客於 App 內回報，請客服聯繫確認', v: { name: '租客回報' }, before: null, after: null, box: null, conf: 1, sev: '租客回報', sec: '0.0' });
  S.phase = S.back; render();
}
function captureHtml() {
  const v = VIEWS[S.idx], c = S.cur;
  if (S.camOn) return camHtml(v);
  const outline = v.interior ? '<rect x="12%" y="18%" width="76%" height="64%" rx="14" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="10 8" opacity=".85"/>' : (v.id === 'left' || v.id === 'right') ? '<rect x="10%" y="30%" width="80%" height="44%" rx="30" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="10 8" opacity=".85"/>' : '<rect x="24%" y="26%" width="52%" height="52%" rx="26" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="10 8" opacity=".85"/>';
  let body = '';
  const label = S.mode === 'pickup' ? '取車' : '還車';
  if (!c) {
    body = `<div class="cam"><svg>${outline}</svg><div class="hint">${v.hint}</div></div>
    <div class="row" style="margin-top:12px"><button class="btn red" style="flex:1" onclick="openCam()">📹 開啟相機</button><button class="btn line" style="flex:1" onclick="document.getElementById('file').click()">🖼️ 選擇照片</button></div>
    <div style="font-size:12px;color:var(--gray);margin:12px 0 6px">或使用示範照片：</div>
    <div class="row"><button class="btn line sm" onclick="useSample('ok')">✅ 正常</button><button class="btn line sm" onclick="useSample('dark')">🌑 太暗</button><button class="btn line sm" onclick="useSample('blur')">🌫️ 模糊</button><button class="btn line sm" onclick="useSample('wrong')">↔️ 角度錯誤</button></div>`;
  } else if (c.status === 'checking') {
    body = `<div class="cam"><img src="${c.photo.url}"></div><div class="step"><div class="spin"></div>AI 檢查照片品質中…</div>`;
  } else {
    const q = c.q;
    body = `<div class="cam"><img src="${c.photo.url}"></div>
    <div class="chips">${q.checks.map((k) => `<span class="chip ${k.ok ? 'ok' : 'bad'}">${k.ok ? '✓' : '✕'} ${k.k}</span>`).join('')}</div>
    ${q.ok ? `<div class="banner ok">照片合格 ✓${q.aiNote ? '（' + q.aiNote + '）' : ''}</div>
      <button class="btn ink" style="width:100%" onclick="nextView()">${S.idx === VIEWS.length - 1 ? '完成拍攝，送出分析' : '下一張'}</button>`
    : `<div class="banner bad">${q.checks.filter((k) => !k.ok).map((k) => k.msg).join('<br>')}</div>
      <button class="btn red" style="width:100%" onclick="retake()">重新拍攝</button>`}`;
  }
  return topBar(`${label}拍攝　${S.idx + 1} / ${VIEWS.length}`, v.name) + `<div class="pad">${progBar()}${body}
    <div class="thumbs">${VIEWS.map((x, i) => `<div class="${i === S.idx ? 'cur' : ''}">${S.photos[x.id] ? `<img src="${S.photos[x.id].url}">` : ''}</div>`).join('')}</div>
    <div class="row" style="margin-top:14px"><button class="btn line sm" onclick="goHome()">離開</button></div></div>`;
}
function analyzingHtml() {
  return topBar('AI 分析中', S.mode === 'pickup' ? '登記既有車損與車內狀況' : '與取車照片比對，找出本次新增狀況') + `<div class="pad">${S.progress.map((p) => `<div class="step">${p.st === 'done' ? '<span style="color:var(--green)">✓</span>' : p.st === 'run' ? '<div class="spin"></div>' : '<span style="color:#bbb">•</span>'}<span>${p.v.name}</span></div>`).join('')}</div>`;
}
function resultHtml() {
  const r = S.result, pick = S.mode === 'pickup';
  let h = topBar(pick ? '取車確認' : '還車結果', `${CAR} ・ ${PLATE}`) + '<div class="pad">';
  if (r.aiErr) h += '<div class="banner warn">部分照片 AI 判讀失敗，已以預設結果顯示</div>';
  if (pick) {
    if (r.dirty.length) h += `<div class="banner bad">⚠️ 車內髒汙（承接前車）<br><span style="font-weight:400">已通知客服。您可選擇換車，或繼續取車並保留紀錄，此狀況不會算在您的責任。</span></div>`;
    h += `<div class="res"><h4>既有車損登記（${r.damages.length}）</h4>${r.damages.length ? r.damages.map((d) => `<div style="margin-bottom:8px"><span class="tag ${SEV[d.severity] || 'low'}">${d.severity}</span> <b style="font-size:13px">${d.location}</b><p>${d.description}</p>${imgBoxPhone(S.photos[d.v.id].url, d.box)}</div>`).join('') : '<p>未發現既有車損</p>'}<p style="font-size:12px">請確認以上為取車前已存在的損傷，還車時只會比對「新增」的部分。</p></div>`;
    h += `<div class="res"><h4>車內清潔度</h4>${r.levels.map((l) => `<p>${l.v.name}：<span class="tag ${l.level === 'dirty' ? 'high' : l.level === 'normal' ? 'mid' : 'low'}">${{ clean: '乾淨', normal: '普通', dirty: '髒汙' }[l.level]}</span> ${l.reason}</p>`).join('')}</div>`;
    h += `<button class="btn red" style="width:100%" onclick="confirmPickup()">確認取車（開始計算租金）</button>`;
  } else {
    const bad = r.damages.length || r.dirty.length;
    h += bad ? `<div class="banner bad">偵測到異常，已即時通知客服（${r.sec} 秒）</div>` : `<div class="banner ok">✓ 未發現異常，已自動放行</div>`;
    if (r.damages.length) h += `<div class="res"><h4>本次新增車損（${r.damages.length}）</h4>${r.damages.map((d) => `<div style="margin-bottom:8px"><span class="tag ${SEV[d.severity] || 'mid'}">${d.severity}</span> <b style="font-size:13px">${d.location}・${TYPE_ZH[d.type] || ''}</b><p>${d.description}</p>${imgBoxPhone(S.photos[d.v.id].url, d.box)}</div>`).join('')}<p style="font-size:12px">AI 僅提出預警，最終由客服人員確認，您可補充說明或提出申訴。</p></div>`;
    h += `<div class="res"><h4>車內清潔度</h4>${r.levels.map((l) => `<p>${l.v.name}：<span class="tag ${l.level === 'dirty' ? 'high' : l.level === 'normal' ? 'mid' : 'low'}">${{ clean: '乾淨', normal: '普通', dirty: '髒汙' }[l.level]}</span> ${l.reason}</p>`).join('')}${r.dirty.length ? '<div style="margin-top:6px"><span class="tag high">髒汙</span> 已通知整備人員清潔</div>' + r.dirty.map((d) => imgBoxPhone(S.photos[d.v.id].url, d.box)).join('') : ''}</div>`;
    if (bad) h += '<button class="btn line" style="width:100%;margin-bottom:10px" onclick="S.phase=\'appeal\';render()">💬 補充說明／申訴</button>';
    h += `<button class="btn ink" style="width:100%" onclick="goParking()">下一步：停車位置與付款</button>`;
  }
  return h + '</div>';
}
function imgBoxPhone(url, box) { return `<div class="imgbox">${`<img src="${url}">`}${boxHtml(box)}</div>`; }


// ============ 相機（getUserMedia，失敗時退回選擇照片）============
function camHtml(v) {
  const outline = v.interior ? '<rect x="12%" y="18%" width="76%" height="64%" rx="14"' : (v.id === 'left' || v.id === 'right') ? '<rect x="10%" y="30%" width="80%" height="44%" rx="30"' : '<rect x="24%" y="26%" width="52%" height="52%" rx="26"';
  return topBar(`${S.mode === 'pickup' ? '取車' : '還車'}拍攝　${S.idx + 1} / ${VIEWS.length}`, v.name) + `<div class="pad">${progBar()}
    <div class="cam"><video id="vid" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video><svg>${outline} fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="10 8" opacity=".9"/></svg><div class="hint">${v.hint}</div></div>
    <div class="row" style="margin-top:14px"><button class="btn red" style="flex:1" onclick="snap()">● 拍照</button><button class="btn line" onclick="stopCam();render()">關閉相機</button></div></div>`;
}
async function openCam() {
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
    S.camOn = true; render();
  } catch (e) { toast('無法開啟相機，請改用「選擇照片」'); document.getElementById('file').click(); }
}
function stopCam() { if (S.stream) S.stream.getTracks().forEach((x) => x.stop()); S.stream = null; S.camOn = false; }
function snap() {
  const vd = document.getElementById('vid'); if (!vd || !vd.videoWidth) { toast('相機尚未就緒'); return; }
  const c = document.createElement('canvas'); c.width = vd.videoWidth; c.height = vd.videoHeight; c.getContext('2d').drawImage(vd, 0, 0);
  const url = c.toDataURL('image/jpeg', .9); stopCam(); handlePhoto({ url, meta: {} });
}

// ============ 流程控制 ============
function startFlow(mode, auto) {
  if (mode === 'return' && !S.rental) S.rental = { startedAt: Date.now() - 1000 * 60 * 102, area: '同站租還', parking: '', credit: 0 };
  S.mode = mode; S.idx = 0; S.photos = {}; S.cur = null; S.phase = 'capture';
  if (auto) { VIEWS.forEach((v) => (S.photos[v.id] = { url: drawSample(v.id, mode, S.scenario, 'ok'), meta: { sample: true } })); analyze(); return; }
  render();
}
function goHome() { stopCam(); S.phase = S.mode === 'return' ? 'driving' : 'home'; render(); }
function useSample(variant) { const v = VIEWS[S.idx]; handlePhoto({ url: drawSample(v.id, S.mode, S.scenario, variant), meta: { sample: true, wrong: variant === 'wrong' } }); }
function onFile(e) { const f = e.target.files[0]; e.target.value = ''; if (!f) return; const r = new FileReader(); r.onload = () => handlePhoto({ url: r.result, meta: {} }); r.readAsDataURL(f); }
async function handlePhoto(photo) {
  const v = VIEWS[S.idx]; S.cur = { photo, status: 'checking' }; render();
  if (!S.ai || photo.meta.sample) await sleep(350);
  const q = await checkQuality(photo, v); S.cur = { photo, q, status: 'done' }; render();
}
function retake() { S.cur = null; render(); }
function nextView() {
  const v = VIEWS[S.idx]; S.photos[v.id] = S.cur.photo; S.cur = null;
  if (S.idx < VIEWS.length - 1) { S.idx++; render(); } else analyze();
}
function confirmPickup() { S.pickup = { photos: Object.fromEntries(VIEWS.map((v) => [v.id, S.photos[v.id].url])), existing: S.result.damages }; S.rental = { startedAt: Date.now() - 1000 * 60 * 102, area: '同站租還', parking: '', credit: 0 }; toast('✅ 已確認取車，既有車損已登記'); S.phase = 'driving'; render(); }
function finishReturn() { S.pickup = null; S.rental = null; S.phase = 'home'; render(); }
function resetAll() { S.pickup = null; S.rental = null; S.phase = 'home'; postJSON('/api/reset').then(() => toast('已重置，後台會重新載入示範資料')).catch(() => {}); render(); }
function toggleAI(on) { S.ai = on && S.aiAvailable; document.getElementById('aiLbl').textContent = S.ai ? 'AI 模式 (Gemini) ● 啟用' : 'AI 模式 (Gemini)'; if (on && !S.aiAvailable) { document.getElementById('aiSw').checked = false; toast('伺服器未設定 Gemini API key'); } }

// ============ 啟動 ============
(async function init() {
  try { const h = await (await fetch('/api/health')).json(); S.aiAvailable = !!h.ai; } catch {}
  if (!S.aiAvailable) document.getElementById('aiLbl').textContent = 'AI 模式（未設定 key）';
  render();
  const q = new URLSearchParams(location.search);
  if (q.get('only')) document.body.classList.add('only-' + q.get('only'));
  if (q.get('scn')) S.scenario = q.get('scn');
  if (q.get('ph')) document.querySelector('.phone').style.height = q.get('ph') + 'px';
  const shot = q.get('shot');
  if (shot === 'dark') { startFlow('return'); useSample('dark'); }
  else if (shot === 'result') { startFlow('return', true); }
  else if (shot === 'dash') { startFlow('return', true); }
})();

</script>
